# Name shown in the GitHub Actions UI
name: Test and Deploy

# Trigger: run on every push to the main branch
on:
  push:
    branches:
      - main

jobs:
  # ── Job 1: Run tests ──────────────────────────────────
  test:
    runs-on: ubuntu-latest           # GitHub spins up a fresh Ubuntu VM

    steps:
      # Step 1: Download your code onto the VM
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Install the right version of Node
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'                # Cache node_modules for faster builds

      # Step 3: Install dependencies (using the lockfile)
      - name: Install dependencies
        run: npm ci

      # Step 4: Run tests — if this fails, the whole workflow stops
      - name: Run tests
        run: npm test

  # ── Job 2: Deploy to Render ───────────────────────────
  deploy:
    runs-on: ubuntu-latest
    needs: test                       # Only runs if the "test" job passed

    steps:
      - name: Deploy to Render
        run: curl "${{ secrets.RENDER_DEPLOY_HOOK }}"
        # secrets.RENDER_DEPLOY_HOOK = the URL we saved in GitHub Secrets
        # curl sends an HTTP request to that URL, which tells Render to deploy